name: CI

on:
  # Every pull request, whatever it is based on. A slice too large for one review is opened on
  # top of the one before it, and a branch nobody checks is exactly the branch that breaks main.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/Forum.slnx

      - name: Build
        run: dotnet build backend/Forum.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/Forum.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Runs even when a suite fails, so the gate reports a failure rather than being skipped:
    # a skipped check satisfies a protection rule, a failed one does not.
    if: always()
    steps:
      - name: Require both suites to have passed
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          echo "Backend: $BACKEND"
          echo "Frontend: $FRONTEND"
          if [ "$BACKEND" != "success" ] || [ "$FRONTEND" != "success" ]; then
            echo "::error::main takes green branches only."
            exit 1
          fi
