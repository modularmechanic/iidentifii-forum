# Serves the built client and forwards the API on the same origin, so the browser sees one host
# and no cross-origin configuration is needed anywhere.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nothing gains from knowing the exact nginx version.
    server_tokens off;

    # The client loads its own scripts and nothing else. Fonts and their stylesheet come from
    # Google, which is why those two hosts are named; everything else is refused. This is what
    # keeps a session token in localStorage out of reach of injected script.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Strict-Transport-Security is deliberately absent: this listens on plain HTTP behind whatever
    # terminates TLS, and the header belongs there rather than here.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The router owns the address bar, so an unknown path is the application's to answer, not a 404
    # from the file system.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
